[project]
name = "wrs-debugger-backend"
version = "0.1.0"
description = "Business-level FastAPI backend for the WRS Debugger"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio>=4.0,<5.0",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.13,<3.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.8,<1.0",
]
desktop = [
  "pyinstaller>=6.11,<7.0",
  "pybind11>=2.13,<4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
